services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bma_user
      POSTGRES_PASSWORD: bma_password
      POSTGRES_DB: bma_outbreak_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bma_user -d bma_outbreak_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://bma_user:bma_password@db:5432/bma_outbreak_db
      DEFAULT_RANDOM_SEED: 42
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:

